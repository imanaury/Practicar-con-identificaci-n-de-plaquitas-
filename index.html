<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Práctica de plaquitas histológicas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--papel:#F7F5FA;--tinta:#1F1B45;--eosina:#C23B6B;--ok:#1E8E5A;--mal:#C0392B;--linea:#DAD5E6;--campo:#15122E}
@media (prefers-color-scheme:dark){:root{--papel:#14122A;--tinta:#EEEAF8;--linea:#3A3566;--campo:#0B0A1A}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--papel);color:var(--tinta);font:16px/1.45 Inter,system-ui,sans-serif;min-height:100dvh;display:flex;flex-direction:column;align-items:center}
main{width:100%;max-width:520px;padding:20px 16px 12px;flex:1}
h1,h2{font-family:Fraunces,Georgia,serif;margin:0}
h1{font-size:2rem;line-height:1.1;font-weight:800}
h2{font-size:1.5rem;font-weight:800;letter-spacing:.01em;margin:14px 0 10px}
p{margin:.6rem 0}
.sub{color:var(--eosina);font-weight:600}
label{display:block;font-weight:600;margin:22px 0 6px}
input{width:100%;font:inherit;padding:14px;border-radius:12px;border:2px solid var(--linea);background:transparent;color:inherit}
input:focus,button:focus-visible{outline:3px solid var(--eosina);outline-offset:2px}
.grupo{display:block;width:100%;text-align:left;font:inherit;padding:16px;margin-top:12px;border-radius:14px;border:2px solid var(--tinta);background:transparent;color:inherit;cursor:pointer}
.grupo b{display:block;font-family:Fraunces,Georgia,serif;font-size:1.25rem}
.grupo span{font-size:.9rem;opacity:.75}
.grupo:active{background:var(--tinta);color:var(--papel)}
#err{color:var(--mal);font-weight:600;min-height:1.4em}
#prog{font-size:.9rem;font-weight:600;opacity:.85}
.pista{height:6px;background:var(--linea);border-radius:9px;margin:8px 0 14px;overflow:hidden}
#barra{height:100%;width:0;background:var(--eosina);transition:width .3s}
.campo{background:var(--campo);border-radius:20px;padding:12px;display:flex;justify-content:center;align-items:center;min-height:240px}
.campo img{max-width:100%;max-height:46vh;object-fit:contain;display:block;border-radius:6px}
.op{display:flex;gap:12px;align-items:center;width:100%;text-align:left;font:inherit;padding:13px 14px;margin-top:10px;border-radius:12px;border:2px solid var(--linea);background:transparent;color:inherit;cursor:pointer}
.op:disabled{cursor:default;color:inherit}
.l{flex:none;width:30px;height:30px;border-radius:50%;background:var(--tinta);color:var(--papel);display:grid;place-items:center;font-weight:700;font-size:.9rem}
.op.bien{border-color:var(--ok);background:var(--ok);color:#fff}
.op.mal{border-color:var(--mal);background:var(--mal);color:#fff}
.op.bien .l,.op.mal .l{background:#fff;color:#111}
#fb{font-weight:700;min-height:1.5em;margin:12px 0 0}
#fb.ok{color:var(--ok)}#fb.no{color:var(--mal)}
.btn{display:block;width:100%;font:inherit;font-weight:600;padding:15px;margin-top:12px;border-radius:12px;border:0;background:var(--eosina);color:#fff;cursor:pointer}
.btn.dos{background:transparent;color:inherit;border:2px solid var(--tinta)}
#nota{font-family:Fraunces,Georgia,serif;font-size:4.2rem;font-weight:800;line-height:1;margin:18px 0 4px}
footer{width:100%;text-align:center;font-size:.8rem;padding:12px 16px 16px;border-top:1px solid var(--linea);opacity:.85}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<section id="inicio">
  <h1>Práctica de plaquitas</h1>
  <p class="sub">Histología · Microscopía y Proyector</p>
  <label for="nombre">Tu nombre</label>
  <input id="nombre" autocomplete="name" placeholder="Nombre y apellido">
  <p id="err" role="alert"></p>
  <p><b>Elige un grupo</b></p>
  <button class="grupo" data-g="micro"><b>Microscopía</b><span>Fotos reales del microscopio · 20 imágenes</span></button>
  <button class="grupo" data-g="proy"><b>Proyector</b><span>Imágenes del proyector · 25 imágenes</span></button>
  <p style="font-size:.9rem;opacity:.8">Tienes 10 intentos por grupo.</p>
</section>

<section id="quiz" hidden>
  <div id="prog"></div>
  <div class="pista"><div id="barra"></div></div>
  <div class="campo"><img id="foto" alt="Plaquita histológica"></div>
  <h2>¿QUÉ OBSERVAS?</h2>
  <div id="ops"></div>
  <p id="fb" role="status"></p>
  <button class="btn" id="sig" hidden></button>
</section>

<section id="fin" hidden>
  <h2>Tu calificación</h2>
  <div id="nota"></div>
  <p id="pct" class="sub"></p>
  <button class="btn" id="otro"></button>
  <p id="tope" hidden><b>Completaste tus 10 intentos de este grupo.</b></p>
  <button class="btn dos" id="cambiar">Cambiar de grupo</button>
</section>
</main>
<footer>Creado por Manauri Aybar · Esto son intentos para practicar</footer>

<script src="preguntas.js"></script>
<script>
const MAX=10;
// Pega aquí la URL de tu Apps Script (termina en /exec). Si la dejas vacía, el conteo solo se guarda en el dispositivo.
const URL_HOJA="https://script.google.com/macros/s/AKfycbzMhi7svVJ6HEnuczHgh_Gua7F_vUSWhI9BfDtn-3KNDMhKN2JBfPEhd3T4jeN7jZSd/exec";
const HOJA=URL_HOJA.startsWith("https://");
const $=id=>document.getElementById(id);
const GRUPOS={micro:"Microscopía",proy:"Proyector"};
const norm=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/\s+/g," ").trim();
const mezcla=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const show=id=>["inicio","quiz","fin"].forEach(s=>$(s).hidden=s!==id);
let S={};

function fam(n){n=norm(n);
  if(/sangre|sanguine/.test(n))return"sangre";
  if(/cartilago/.test(n))return"cart";
  if(/hueso|osea/.test(n))return"hueso";
  if(/nervi|cerebr|cerebel|espinal|neuromus/.test(n))return"nerv";
  if(/muscul/.test(n))return"musc";
  return"otro"}
const choca=(a,b)=>/osinófilo/.test(a)&&/osinófilo/.test(b);
function opciones(c,g){
  const nombres=[...new Set(BANCO.filter(x=>x.g===g).map(x=>x.n))].filter(n=>n!==c);
  const orden=[...mezcla(nombres.filter(n=>fam(n)===fam(c))),...mezcla(nombres.filter(n=>fam(n)!==fam(c)))];
  const el=[c];
  for(const n of orden){if(el.length===4)break;if(el.some(o=>choca(o,n)))continue;el.push(n)}
  return mezcla(el)}

const llave=(n,g)=>"intentos:"+norm(n)+":"+g;
const usadosLocal=(n,g)=>{try{return +localStorage.getItem(llave(n,g))||0}catch(e){return 0}};
async function usadosHoja(n,g){
  if(!HOJA)return 0;
  try{const c=new AbortController();setTimeout(()=>c.abort(),4000);
    const r=await fetch(URL_HOJA+"?clave="+encodeURIComponent(norm(n))+"&grupo="+g,{signal:c.signal});
    return (await r.json()).n||0}catch(e){return 0}}

async function empezar(g){
  const nombre=$("nombre").value.trim();
  if(nombre.length<3){$("err").textContent="Escribe tu nombre completo para continuar.";$("nombre").focus();return}
  $("err").textContent="Comprobando tus intentos…";
  const u=Math.max(usadosLocal(nombre,g),await usadosHoja(nombre,g));
  if(u>=MAX){$("err").textContent="Ya usaste los "+MAX+" intentos de "+GRUPOS[g]+". Prueba con el otro grupo.";return}
  $("err").textContent="";
  try{localStorage.setItem("nombre",nombre)}catch(e){}
  S={nombre,g,usados:u};arranca()}

function arranca(){
  S.ok=0;S.i=0;S.bloq=false;S.r=[];
  S.p=mezcla(BANCO.filter(x=>x.g===S.g)).map(x=>({...x,o:opciones(x.n,x.g)}));
  show("quiz");pinta()}

function pinta(){
  const q=S.p[S.i];
  $("prog").textContent="Intento "+(S.usados+1)+" de "+MAX+" · Pregunta "+(S.i+1)+" de "+S.p.length;
  $("barra").style.width=(S.i/S.p.length*100)+"%";
  $("foto").src="img/"+q.id+".webp";
  $("ops").innerHTML="";
  q.o.forEach((t,k)=>{
    const b=document.createElement("button");b.className="op";
    b.innerHTML='<span class="l">'+"ABCD"[k]+"</span><span></span>";
    b.lastChild.textContent=t;b.onclick=()=>resp(b,t);$("ops").append(b)});
  $("fb").textContent="";$("fb").className="";$("sig").hidden=true;S.bloq=false;
  window.scrollTo(0,0)}

function resp(b,t){
  if(S.bloq)return;S.bloq=true;
  const q=S.p[S.i],bien=t===q.n;if(bien)S.ok++;S.r.push([q.id,q.n,t]);
  [...$("ops").children].forEach(x=>{x.disabled=true;if(x.lastChild.textContent===q.n)x.classList.add("bien")});
  if(!bien)b.classList.add("mal");
  $("fb").textContent=bien?"¡Correcto!":"Incorrecto. La respuesta correcta está en verde.";
  $("fb").className=bien?"ok":"no";
  $("sig").textContent=S.i===S.p.length-1?"Ver calificación":"Siguiente pregunta →";
  $("sig").hidden=false}

$("sig").onclick=()=>{S.i++;S.i<S.p.length?pinta():fin()};

function fin(){
  const n=S.usados+1;S.usados=n;
  try{localStorage.setItem(llave(S.nombre,S.g),n)}catch(e){}
  if(HOJA)fetch(URL_HOJA,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},
    body:JSON.stringify({nombre:S.nombre,clave:norm(S.nombre),grupo:S.g,intento:n,aciertos:S.ok,total:S.p.length,respuestas:S.r})}).catch(()=>{});
  $("nota").textContent=S.ok+" / "+S.p.length;
  $("pct").textContent=Math.round(S.ok/S.p.length*100)+" % de aciertos · "+GRUPOS[S.g];
  const quedan=n<MAX;$("otro").hidden=!quedan;$("tope").hidden=quedan;
  $("otro").textContent="Intento "+(n+1);
  show("fin");window.scrollTo(0,0)}

$("otro").onclick=arranca;
$("cambiar").onclick=()=>{show("inicio")};
document.querySelectorAll(".grupo").forEach(b=>b.onclick=()=>empezar(b.dataset.g));
try{$("nombre").value=localStorage.getItem("nombre")||""}catch(e){}
</script>
</body>
</html>
